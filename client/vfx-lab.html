<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Attunement — VFX lab</title>
    <style>
      body { margin: 0; background: #1b1d22; overflow: hidden; font: 12px system-ui, sans-serif; color: #dde3ea; }
      canvas { display: block; }
      #panel { position: absolute; top: 8px; left: 8px; width: 270px; background: rgba(14, 16, 20, 0.86); border: 1px solid #333a44; border-radius: 6px; padding: 8px; }
      #panel label { display: flex; justify-content: space-between; align-items: center; gap: 6px; margin: 4px 0; }
      #panel select, #panel input[type=number] { width: 150px; background: #23272e; color: #dde3ea; border: 1px solid #3a414c; }
      #panel input[type=range] { width: 100%; }
      #panel .row { display: flex; gap: 4px; margin: 6px 0; }
      #panel button { flex: 1; background: #2b313a; color: #dde3ea; border: 1px solid #45505c; padding: 3px; cursor: pointer; }
      #stats { white-space: pre; font: 11px ui-monospace, monospace; color: #9fb0c0; margin-top: 6px; }
      body.capture #panel { display: none; }
    </style>
  </head>
  <body>
    <canvas id="view"></canvas>
    <div id="panel" aria-label="VFX lab controls">
      <label>Effect <select id="fx"></select></label>
      <div class="row"><button id="play">Pause</button><button id="restart">Restart</button><button id="shot">Screenshot</button></div>
      <label>Time <span id="tval">0.00 s</span></label>
      <input id="time" type="range" min="0" max="4" step="0.01" value="0" aria-label="Timeline" />
      <label>Speed <select id="speed"><option>0.1</option><option>0.25</option><option>0.5</option><option selected>1</option><option>2</option></select></label>
      <label>Seed <input id="seed" type="number" value="7" /></label>
      <label>Quality <select id="q"><option value="0">0 low</option><option value="1">1 medium</option><option value="2" selected>2 high</option></select></label>
      <label>Lighting <select id="light"><option>studio</option><option>day</option><option>dusk</option><option>night</option></select></label>
      <label>Concurrent <select id="n"><option>1</option><option>4</option><option>9</option></select></label>
      <label>Reduced motion <input id="rm" type="checkbox" /></label>
      <div id="stats"></div>
    </div>
    <script type="importmap">{"imports":{"three":"/vendor/three/three.module.js","three/addons/":"/vendor/three-addons/"}}</script>
    <script type="module" src="/client/src/vfx-lab.js"></script>
  </body>
</html>
