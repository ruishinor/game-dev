  <linearGradient id="frame" x2=".85" y2="1"><stop stop-color="#28363c"/><stop offset=".5" stop-color="#19272d"/><stop offset="1" stop-color="#101c24"/></linearGradient>
  <radialGradient id="spore"><stop stop-color="#655165"/><stop offset=".54" stop-color="#4b3d54"/><stop offset="1" stop-color="#30453e"/></radialGradient>
  <radialGradient id="vault"><stop stop-color="#494a6b"/><stop offset=".57" stop-color="#333956"/><stop offset="1" stop-color="#29433d"/></radialGradient>
  <radialGradient id="sinter"><stop stop-color="#c0a783"/><stop offset=".57" stop-color="#95816c"/><stop offset="1" stop-color="#364840"/></radialGradient>
  <radialGradient id="brine"><stop stop-color="#a2866a"/><stop offset=".62" stop-color="#766458"/><stop offset="1" stop-color="#35443c"/></radialGradient>
  <radialGradient id="relay"><stop stop-color="#6e6155"/><stop offset=".58" stop-color="#524b45"/><stop offset="1" stop-color="#32473d"/></radialGradient>
