  <radialGradient id="stone"><stop stop-color="#607a79"/><stop offset=".6" stop-color="#3d595a"/><stop offset="1" stop-color="#30413b"/></radialGradient>
  <radialGradient id="sanctum"><stop stop-color="#517980"/><stop offset=".65" stop-color="#325b60"/><stop offset="1" stop-color="#2c4542"/></radialGradient>
