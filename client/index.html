<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Attunement</title>
    <!-- Prevent an unsolicited /favicon.ico request; a branded icon can follow later. -->
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="/client/style.css" />
  </head>
  <body>
    <canvas id="view" tabindex="0" aria-label="Game world"></canvas>
    <div id="overlay" aria-hidden="true"></div>
    <div id="hud" hidden></div>

    <main id="login">
      <div class="login-card">
        <h1>Attunement</h1>
        <p class="tagline">The Verdigris Reach — where old machines, living things and stranger forces share one valley.</p>
        <p id="resuming" hidden>Returning to your character…</p>
        <form id="login-form" autocomplete="off">
          <label for="name">Character name</label>
          <input id="name" name="name" maxlength="16" required spellcheck="false" placeholder="3–16 letters" />
          <div class="label">Calling</div>
          <div id="classes"></div>
          <div id="look-row" hidden>
            <div class="label">Appearance</div>
            <div id="looks"></div>
          </div>
          <p id="login-error" role="alert"></p>
          <button id="enter" class="primary" type="submit" disabled>Loading the Reach…</button>
          <p class="hint">Two players on one computer: open this page a second time with <code>?slot=2</code> on the address.</p>
        </form>
      </div>
    </main>
    <div id="status" role="status" hidden></div>
    <script type="importmap">{"imports":{"three":"/vendor/three/three.module.js","three/addons/":"/vendor/three-addons/"}}</script>
    <script type="module" src="/client/src/main.js"></script>
  </body>
</html>
