name: Desktop and TV window management
on:
  pull_request:
    paths:
      - 'client/src/window-layout.js'
      - 'client/window-management.css'
      - 'client/desktop-windows.css'
      - 'client/src/inventory-page.js'
      - 'client/src/journal-ui.js'
      - 'client/src/workshop-ui.js'
      - 'client/src/world-atlas.js'
      - 'client/src/ui.js'
      - 'client/index.html'
      - 'test/e2e/desktop-windows.mjs'
      - '.github/workflows/desktop-windows.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    strategy:
      fail-fast: false
      matrix:
        mode: [desktop, hd, qhd, tv, tvScaled]
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: node test/e2e/desktop-windows.mjs
        env:
          ATTUNEMENT_WINDOW_TEST_MODE: ${{ matrix.mode }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: desktop-windows-${{ matrix.mode }}
          path: window-evidence/
          if-no-files-found: ignore
