name: Playable preview inspection
on:
  pull_request:
    paths:
      - 'client/**'
      - 'shared/**'
      - 'server/**'
      - 'test/e2e/preview-expansion.mjs'
      - '.github/workflows/preview-expansion.yml'
  workflow_dispatch:

# Replace obsolete PR runs, not independently requested manual dispatches.
concurrency:
  group: ${{ github.workflow }}-pr-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  playable:
    runs-on: ubuntu-latest
    # Functional evidence suite; software GL and artifact upload take variable time.
    # The test itself also has a separate finite execution limit.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Run playable preview assertions
        timeout-minutes: 20
        run: node test/e2e/preview-expansion.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: playable-preview-evidence
          path: preview-evidence/
          if-no-files-found: ignore
