name: Kestrel source-only GLB inventory

on:
  pull_request:
    paths:
      - 'tools/assets/kestrel-source-inventory.mjs'
      - 'assets/source-archives/glb-low-poly-models-building-blocks.zip'
      - 'client/src/kestrel-deep-visuals.js'
      - 'client/src/kestrel-pressure-plant.js'
      - 'client/src/kestrel-regulator-gallery.js'
      - '.github/workflows/kestrel-source-inventory.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Inventory 138 source GLBs (never promote source assets)
        run: node tools/assets/kestrel-source-inventory.mjs
      - name: Syntax check Kestrel visual module
        run: node --check client/src/kestrel-deep-visuals.js
