name: Kestrel real-scene visual smoke

on:
  pull_request:
    paths:
      - 'client/src/kestrel-deep-visuals.js'
      - 'client/src/kestrel-pressure-plant.js'
      - 'client/src/kestrel-regulator-gallery.js'
      - 'test/kestrel-regulators.test.js'
      - 'client/src/scene.js'
      - 'test/e2e/kestrel-visual.mjs'
      - '.github/workflows/kestrel-visual.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  kestrel:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Inspect actual GLB-dressed Kestrel Deep
        run: node test/e2e/kestrel-visual.mjs
      - name: Preserve evidence for manual artistic review
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: kestrel-visual-evidence
          path: kestrel-evidence/
          if-no-files-found: ignore
