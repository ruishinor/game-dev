name: Integrated browser playtest
on:
  pull_request:
    branches: [main, ccr-9a6736d4-kufz9x, preview/playtest-pr4-5-6, preview/playtest-brineworks]
    types: [opened, synchronize, reopened, edited, ready_for_review]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  playtest:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Focused Workshop playtest
        if: github.base_ref == 'main' || github.base_ref == 'preview/playtest-pr4-5-6' || github.base_ref == 'preview/playtest-brineworks' || github.ref_name == 'feat/workshop-character-interactions'
        run: npm run e2e -- --workshop
      - name: Integrated two-player playtest
        if: always() && github.ref_name != 'feat/workshop-character-interactions'
        run: npm run e2e
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: playtest-screenshots
          path: test/e2e/out/
          if-no-files-found: ignore
