name: One-off Warden ceramic-ebony production GLB rebuild
on:
  pull_request:
    paths:
      - 'tools/asset-pipeline/asset_pipeline/blender/humanoid_build.py'
      - 'tools/asset-pipeline/asset_pipeline/humanoid_materials.py'
      - 'tools/asset-pipeline/asset_pipeline/humanoid_wardrobe.py'
      - 'tools/asset-pipeline/assets/halo_construct/asset.json'
      - 'tools/asset-pipeline/tests/test_warden_lower.py'
      - 'client/src/warden-head-fx.js'
      - 'client/src/warden-materials.js'
      - '.github/workflows/halo-warden-material-production.yml'
jobs:
  author:
    if: github.repository == 'ruishinor/game-dev' && github.event.pull_request.head.repo.full_name == 'ruishinor/game-dev' && github.head_ref == 'feat/warden-head-material-vfx-20261123'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - name: Install asset authoring dependencies
        run: |
          python -m pip install -r tools/asset-pipeline/requirements.txt
          npm ci
      - name: Compile all Python source and test fitted Warden material geometry
        run: |
          python -m compileall -q tools/asset-pipeline/asset_pipeline
          cd tools/asset-pipeline
          python -m unittest discover -s tests -v
      - name: Rebuild complete skinned Halo production asset
        working-directory: tools/asset-pipeline
        run: python -m asset_pipeline all --asset halo_construct
      - name: Publish candidate to local runtime manifest, validate GLB provenance
        run: |
          node tools/assets/build.mjs halo_construct
          python - <<'PY'
          import hashlib, json, pathlib
          glb=pathlib.Path('client/assets/halo_construct.glb')
          exp=pathlib.Path('tools/asset-pipeline/assets/halo_construct/outputs/export.json')
          assert glb.is_file() and exp.is_file()
          data=glb.read_bytes()
          record=json.loads(exp.read_text())
          assert data[:4] == b'glTF', 'invalid runtime GLB header'
          assert record['sha256'] == hashlib.sha256(data).hexdigest(), 'stale output provenance hash'
          assert record['bytes'] == len(data), 'stale output provenance size'
          print('VERIFIED_WARDEN_GLB',record['sha256'],len(data))
          PY
      - name: Inspect the rebuilt Warden in authenticated browser gameplay
        run: |
          npx playwright install --with-deps chromium
          node test/e2e/halo-npcs.mjs
      - name: Stage only exact validated runtime asset files
        run: |
          mkdir -p output/runtime
          cp client/assets/halo_construct.glb output/runtime/halo_construct.glb
          cp client/assets/manifest.json output/runtime/manifest.json
          cp tools/asset-pipeline/assets/halo_construct/outputs/export.json output/runtime/export.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: warden-ceramic-ebony-validated-runtime
          path: output/
          retention-days: 14
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: warden-ceramic-ebony-visual-evidence
          path: halo-evidence/
          retention-days: 14
          if-no-files-found: ignore
  publish:
    needs: author
    if: github.repository == 'ruishinor/game-dev' && github.event.pull_request.head.repo.full_name == 'ruishinor/game-dev' && github.head_ref == 'feat/warden-head-material-vfx-20261123'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Reject changes to the reviewed source head
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD" || { echo 'PR head changed since authoring; refuse stale binary publication'; exit 1; }
      - uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: warden-ceramic-ebony-validated-runtime
          path: candidate/
      - name: Verify and commit only the generated runtime GLB, manifest and provenance
        run: |
          test "$(head -c4 candidate/runtime/halo_construct.glb)" = glTF
          cp candidate/runtime/halo_construct.glb client/assets/halo_construct.glb
          cp candidate/runtime/manifest.json client/assets/manifest.json
          cp candidate/runtime/export.json tools/asset-pipeline/assets/halo_construct/outputs/export.json
          python - <<'PY'
          import hashlib, json, pathlib
          raw=pathlib.Path('client/assets/halo_construct.glb').read_bytes()
          row=json.loads(pathlib.Path('tools/asset-pipeline/assets/halo_construct/outputs/export.json').read_text())
          assert row['sha256']==hashlib.sha256(raw).hexdigest() and row['bytes']==len(raw)
          PY
          git add -- client/assets/halo_construct.glb client/assets/manifest.json tools/asset-pipeline/assets/halo_construct/outputs/export.json
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'build(halo): publish validated ceramic-ebony Warden production GLB'
            git push origin HEAD:refs/heads/feat/warden-head-material-vfx-20261123
          fi
