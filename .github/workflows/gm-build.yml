name: Owner GM build browser verification
on:
  pull_request:
    paths:
      - 'server/gm*.js'
      - 'server/sim/game.js'
      - 'server/sim/progress.js'
      - 'server/store.js'
      - 'server/net.js'
      - 'shared/build.js'
      - 'client/src/ui.js'
      - 'client/src/journal-ui.js'
      - 'client/src/workshop-ui.js'
      - 'test/e2e/gm-build.mjs'
      - '.github/workflows/gm-build.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  gm-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: node test/e2e/gm-build.mjs
