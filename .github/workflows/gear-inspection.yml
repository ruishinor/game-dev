name: Profession equipment visual inspection
on:
  pull_request:
    paths:
      - 'client/src/gear-recipes.js'
      - 'client/src/looks.js'
      - 'client/src/utility-pouch.js'
      - 'tools/gear-capture.mjs'
      - '.github/workflows/gear-inspection.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: node tools/gear-capture.mjs ci
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: profession-gear-evidence
          path: docs/evidence/gear/ci/
          if-no-files-found: ignore
