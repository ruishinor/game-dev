name: Profession equipment visual inspection
on:
  pull_request:
    paths:
      - 'client/src/gear-recipes.js'
      - 'client/src/looks.js'
      - 'client/src/utility-pouch.js'
      - 'tools/gear-capture.mjs'
      - '.github/workflows/gear-inspection.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: node tools/gear-capture.mjs ci
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: profession-gear-evidence
          path: docs/evidence/gear/ci/
          if-no-files-found: ignore
