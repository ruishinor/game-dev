name: Lumenfen Blender static donor remesh
on:
  pull_request:
    paths:
      - 'tools/assets/lumenfen-remesh.py'
      - 'tools/assets/lumenfen-remesh-verify.mjs'
      - 'assets/lumenfen-donors.json'
      - '.github/workflows/lumenfen-static-remesh.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  remodel:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - run: npm ci
      - name: Install Blender Python authoring runtime
        run: python -m pip install --disable-pip-version-check --no-cache-dir 'bpy==5.3.0'
      - name: Validate the owner archive and select production donor geometry
        run: |
          python3 tools/assets/lumenfen-source-inventory.py
          python3 tools/assets/lumenfen-stage-donors.py .asset-cache/pipeline/lumenfen/stage
          node tools/assets/lumenfen-compose-donors.mjs .asset-cache/pipeline/lumenfen/stage .asset-cache/pipeline/lumenfen/outputs
          node tools/assets/lumenfen-verify-source-study.mjs .asset-cache/pipeline/lumenfen/outputs
      - name: Run real Blender topology refinement and authored detail geometry
        run: |
          python tools/assets/lumenfen-remesh.py \
            .asset-cache/pipeline/lumenfen/outputs/lumenfen-donor-composite.glb \
            .asset-cache/pipeline/lumenfen/remeshed
      - name: Inspect the actual exported GLB meshes and material lineage
        run: node tools/assets/lumenfen-remesh-verify.mjs .asset-cache/pipeline/lumenfen/remeshed
      - name: Preserve remeshed GLBs and machine-verifiable reports for review
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lumenfen-static-donor-remeshed-glbs
          path: .asset-cache/pipeline/lumenfen/remeshed/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
