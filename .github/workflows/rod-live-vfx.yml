name: Electrical rod live VFX
on:
  pull_request:
    paths:
      - 'client/src/electrical-rod.js'
      - 'client/src/vfx/electrical-rod.js'
      - 'client/src/vfx/rod-corona.js'
      - 'client/src/characters.js'
      - 'client/src/main.js'
      - 'test/e2e/rod-live-vfx.mjs'
      - '.github/workflows/rod-live-vfx.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-pr-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
jobs:
  rod-live:
    strategy:
      fail-fast: false
      matrix:
        class: [vanguard, symbiotech, surveyor, keeper]
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: node test/e2e/rod-live-vfx.mjs
        env:
          ATTUNEMENT_ROD_TEST_CLASS: ${{ matrix.class }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: rod-live-evidence-${{ matrix.class }}
          path: rod-live-evidence/
          if-no-files-found: ignore
