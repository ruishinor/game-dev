name: Cinematic Gate login browser verification
on:
  pull_request:
    paths:
      - 'client/index.html'
      - 'client/style.css'
      - 'client/login/**'
      - 'client/src/main.js'
      - 'server/index.js'
      - 'test/e2e/cinematic-login.mjs'
      - '.github/workflows/cinematic-login.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-pr-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
jobs:
  login:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: node test/e2e/cinematic-login.mjs
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cinematic-login-real-browser-screenshots
          path: test/e2e/out/login-*.png
          if-no-files-found: ignore
