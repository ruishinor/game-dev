name: Neural voice library candidates
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audition:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install offline-production tools
        run: |
          sudo apt-get update
          sudo apt-get install -y espeak-ng ffmpeg
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.7.1
          python -m pip install kokoro==0.9.4 soundfile==0.13.1
      - name: Render remaining library candidates
        env:
          HF_HUB_DISABLE_TELEMETRY: '1'
          HF_HUB_DISABLE_IMPLICIT_TOKEN: '1'
        run: python tools/voice/audition.py --remaining
      - uses: actions/upload-artifact@v4
        with:
          name: neural-voice-library-unreviewed
          path: voice-auditions/
          if-no-files-found: error
          retention-days: 7
