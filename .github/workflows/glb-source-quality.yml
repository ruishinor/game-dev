name: Source-only GLB material and geometry audit

on:
  pull_request:
    paths:
      - 'tools/assets/glb-source-quality.mjs'
      - 'test/glb-source-quality.test.js'
      - 'assets/source-archives/glb-low-poly-models-building-blocks.zip'
      - '.github/workflows/glb-source-quality.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Audit all 138 source GLBs without extracting to runtime
        run: node tools/assets/glb-source-quality.mjs > glb-source-quality.json
      - name: Verify source-only report and no automatic promotion
        run: |
          node --input-type=module -e "
          import fs from 'node:fs';
          const r=JSON.parse(fs.readFileSync('glb-source-quality.json'));
          if(r.summary.models!==138 || r.sourceOnly!==true || r.productionReady!==false ||
             r.models.some(x=>x.productionReady!==false || x.rightsVerified!==false))
            process.exit(1);
          console.log(JSON.stringify(r.summary));"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v4.6.2
        with:
          name: source-glb-quality-metrics
          path: glb-source-quality.json
          retention-days: 14
