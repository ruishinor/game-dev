name: Quest Journal browser integration
on:
  pull_request:
    paths:
      - 'client/**'
      - 'shared/**'
      - 'server/**'
      - 'test/e2e/quest-journal.mjs'
      - '.github/workflows/quest-journal.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  journal:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: node test/e2e/quest-journal.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quest-journal-evidence
          path: quest-evidence/
          if-no-files-found: ignore
