name: Party HUD browser integration
on:
  pull_request:
    paths:
      - 'client/src/ui.js'
      - 'client/style.css'
      - 'test/e2e/party-hud.mjs'
      - '.github/workflows/party-hud.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  party:
    runs-on: ubuntu-latest
    timeout-minutes: 17
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: node test/e2e/party-hud.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: party-hud-evidence
          path: test/e2e/out/party-status.png
          if-no-files-found: ignore
