name: Rift browser integration
on:
  pull_request:
    paths:
      - 'server/sim/rift.js'
      - 'server/sim/game.js'
      - 'server/sim/progress.js'
      - 'shared/world.js'
      - 'client/src/rift-visual.js'
      - 'client/src/severance-gate.js'
      - 'client/src/severance-pocket.js'
      - 'client/src/scene.js'
      - 'shared/severance-gate.js'
      - 'server/sim/severance-gate.js'
      - 'tools/asset-pipeline/assets/severance_gate/outputs/severance_gate.glb'
      - 'client/src/main.js'
      - 'client/src/models.js'
      - 'client/src/vfx/combat.js'
      - 'test/e2e/rift.mjs'
      - '.github/workflows/rift.yml'
  workflow_dispatch:

# A newer head supersedes only the same PR's old browser run;
# distinct manual dispatches use their unique run IDs and remain independent.
concurrency:
  group: ${{ github.workflow }}-pr-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  rift:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: node test/e2e/rift.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: rift-evidence
          path: rift-evidence/
          if-no-files-found: ignore
