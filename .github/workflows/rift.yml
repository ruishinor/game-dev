name: Rift browser integration
on:
  pull_request:
    paths:
      - 'server/sim/rift.js'
      - 'server/sim/game.js'
      - 'server/sim/progress.js'
      - 'shared/world.js'
      - 'client/src/rift-visual.js'
      - 'client/src/main.js'
      - 'client/src/models.js'
      - 'client/src/vfx/combat.js'
      - 'test/e2e/rift.mjs'
      - '.github/workflows/rift.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rift:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: node test/e2e/rift.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rift-evidence
          path: rift-evidence/
          if-no-files-found: ignore
