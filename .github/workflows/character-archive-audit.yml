name: Character source archive audit
on:
  pull_request:
    paths:
      - 'tools/assets/audit-character-archive.py'
      - '.github/workflows/character-archive-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect-character-donors:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Inspect source GLB archive without extraction to runtime
        run: python3 tools/assets/audit-character-archive.py
      - name: Upload non-binary GLB metadata report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: archive-character-candidates
          path: artifacts/archive-character-candidates.json
          if-no-files-found: error
          retention-days: 7
