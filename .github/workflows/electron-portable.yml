name: Electron Windows portable build
on:
  pull_request:
    paths:
      - 'desktop/**'
      - 'server/index.js'
      - 'package.json'
      - 'package-lock.json'
      - 'test/desktop-package.test.js'
      - '.github/workflows/electron-portable.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  portable:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          cache: npm
      - name: Windows portable package and targeted tests
        shell: pwsh
        run: |
          & ".\desktop\build-windows.ps1"
      - name: Verify unpacked app (no archive or source art)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = @(Get-ChildItem dist\desktop -Filter '*-portable.exe' -File)
          if ($exe.Count -ne 1) { throw "Expected one portable executable; got $($exe.Count)" }
          $res = 'dist\desktop\win-unpacked\resources'
          if (-not (Test-Path (Join-Path $res 'app.asar'))) { throw 'Missing packaged app.asar' }
          $models = @(Get-ChildItem (Join-Path $res 'runtime-models') -File)
          if ($models.Count -ne 12) { throw "Expected exactly 12 staged runtime GLBs; got $($models.Count)" }
          if (@($models | Where-Object { $_.Extension -ne '.glb' }).Count -gt 0) { throw 'Non-GLB in runtime model directory' }
          $forbidden = @(Get-ChildItem (Join-Path $res 'runtime-models') -File -Recurse |
            Where-Object { $_.Extension -match '^\.(zip|7z|rar|blend|fbx|obj|psd)$' })
          if ($forbidden.Count -gt 0) { throw 'Source model/archive leaked into desktop resources' }
          Write-Host "Validated $($exe[0].Name), app.asar and $($models.Count) runtime GLBs"
      # Deliberately do not upload the executable or authoritative server as a public CI artifact.
