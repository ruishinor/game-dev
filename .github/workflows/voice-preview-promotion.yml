name: Private reviewed voice promotion
on:
  pull_request:
    paths:
      - 'tools/voice/approved-preview-decisions.json'
      - 'tools/voice/approve-library.py'
      - 'test/assets.test.js'
      - 'test/radio-playback.test.js'
      - 'test/e2e/radio-audio.mjs'
      - 'client/src/radio.js'
      - 'client/src/radio-playback.js'
      - 'server/index.js'
      - '.github/workflows/voice-preview-promotion.yml'
permissions: {}
concurrency:
  group: private-radio-promotion
  cancel-in-progress: false
jobs:
  prepare:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feat/prerecorded-radio-foundation' && github.event.pull_request.base.ref == 'preview/playtest-brineworks'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          name: neural-voice-auditions-unreviewed
          run-id: 44164367403
          github-token: ${{ github.token }}
          path: voice-auditions
      - uses: actions/download-artifact@v4
        with:
          name: neural-voice-library-unreviewed
          run-id: 44167225466
          github-token: ${{ github.token }}
          path: voice-library
      - run: |
          python -m pip install numpy==2.4.6
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python tools/voice/promote.py voice-auditions tools/voice/approved-preview-decisions.json --private-playtest --apply
          python tools/voice/approve-library.py voice-library /tmp/remaining-decisions.json
          python tools/voice/promote.py voice-library /tmp/remaining-decisions.json --private-playtest --apply
          npm ci
          npm test
      - uses: actions/upload-artifact@v4
        with:
          name: reviewed-private-radio-assets
          path: |
            client/assets/voice/*.mp3
            client/src/radio-assets.js
          if-no-files-found: error
          retention-days: 7
      - run: npx playwright install --with-deps chromium
      - run: node test/e2e/radio-audio.mjs
  checkpoint:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: reviewed-private-radio-assets
          path: client
      - name: Checkpoint reviewed binary assets only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          gh auth setup-git
          test "$(git ls-remote origin refs/heads/feat/prerecorded-radio-foundation | cut -f1)" = "$(git rev-parse HEAD)"
          test "$(find client/assets/voice -maxdepth 1 -name '*.mp3' | wc -l)" -eq 26
          git add -- client/src/radio-assets.js client/assets/voice/*.mp3
          git diff --cached --check
          if git diff --cached --quiet; then echo 'Exact library already present'; exit 0; fi
          test "$(git diff --cached --name-only | wc -l)" -le 27
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(voice): integrate complete owner-reviewed private radio library'
          git push origin HEAD:refs/heads/feat/prerecorded-radio-foundation
