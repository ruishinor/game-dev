name: Approved voice library integration
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/voice-preview-promotion.yml'
      - 'tools/voice/install-reviewed.py'
  workflow_dispatch:
permissions: {}
concurrency:
  group: approved-radio-library
  cancel-in-progress: false
jobs:
  prepare:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feat/approved-radio-library' && github.event.pull_request.base.ref == 'preview/playtest-brineworks'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: reviewed-private-radio-assets
          run-id: 44181033412
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/approved-radio-source
      - run: |
          python3 tools/voice/install-reviewed.py "$RUNNER_TEMP/approved-radio-source"
          npm ci
          node --test test/radio-assets.test.js test/radio-playback.test.js test/radio.test.js test/assets.test.js
      - run: npx playwright install --with-deps chromium
      - run: node test/e2e/radio-audio.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: validated-noncommercial-radio-library
          path: |
            client/assets/voice/*.mp3
            client/src/radio-assets.js
          if-no-files-found: error
          retention-days: 7
  checkpoint:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: validated-noncommercial-radio-library
          path: client
      - name: Commit only the successfully validated recordings
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          test "$(git ls-remote origin refs/heads/feat/approved-radio-library | cut -f1)" = "$(git rev-parse HEAD)"
          test "$(find client/assets/voice -maxdepth 1 -name '*.mp3' | wc -l)" -eq 26
          git add -- client/src/radio-assets.js client/assets/voice/*.mp3
          git diff --cached --check
          git diff --cached --quiet && exit 0
          test "$(git diff --cached --name-only | wc -l)" -eq 27
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(voice): install 26 owner-approved noncommercial playtest recordings'
          gh auth setup-git
          git push origin HEAD:refs/heads/feat/approved-radio-library
