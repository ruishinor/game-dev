name: Longpoint browser integration
on:
  pull_request:
    paths:
      - 'client/assets/manifest.json'
      - 'client/assets/longpoint.glb'
      - 'client/src/longpoint.js'
      - 'client/src/rifle-families.js'
      - 'client/src/longpoint-finish.js'
      - 'client/src/assets.js'
      - 'client/src/characters.js'
      - 'client/src/main.js'
      - 'client/src/vfx/**'
      - 'client/src/preview.js'
      - 'server/sim/game.js'
      - 'shared/weapon-visual.js'
      - 'shared/content.js'
      - 'test/e2e/longpoint.mjs'
      - 'tools/assets/longpoint.mjs'
      - '.github/workflows/longpoint.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  longpoint:
    strategy:
      fail-fast: false
      matrix:
        family: [longpoint, relay-carbine, bastion-rifle]
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: node test/e2e/longpoint.mjs
        env:
          ATTUNEMENT_RIFLE_TEST_FAMILY: ${{ matrix.family }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: rifle-evidence-${{ matrix.family }}
          path: longpoint-evidence/
          if-no-files-found: ignore
