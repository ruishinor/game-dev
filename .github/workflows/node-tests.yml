name: Node regression tests

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: node --check client/src/main.js && node --check client/src/ui.js && node --check client/src/portraits.js && node --check client/src/journal.js && node --check client/src/journal-ui.js && node --check client/src/workshop-ui.js && node --check client/src/scene.js && node --check client/src/looks.js && node --check test/e2e/play.mjs
