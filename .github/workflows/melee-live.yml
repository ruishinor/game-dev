name: Deliberate melee live gameplay
on:
  pull_request:
    paths:
      - 'server/sim/melee.js'
      - 'server/sim/combat.js'
      - 'server/net.js'
      - 'client/src/characters.js'
      - 'client/src/anim-tables.js'
      - 'client/src/main.js'
      - 'client/src/vfx/combat.js'
      - 'client/src/hotkey-bindings.js'
      - 'test/melee-combat.test.js'
      - 'test/e2e/melee-control.mjs'
      - '.github/workflows/melee-live.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  melee-live:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: node test/e2e/melee-control.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: melee-live-evidence
          path: melee-live-evidence/
          if-no-files-found: ignore
