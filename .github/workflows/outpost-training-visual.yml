name: Severance outpost range and armory live visual evidence

on:
  pull_request:
    paths:
      - 'client/src/outpost-training.js'
      - 'client/src/severance-outpost.js'
      - 'shared/severance-gate.js'
      - 'shared/world.js'
      - 'server/sim/outpost-training.js'
      - 'server/sim/progress.js'
      - 'test/outpost-training.test.js'
      - 'test/e2e/outpost-training-visual.mjs'
      - '.github/workflows/outpost-training-visual.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop-tv:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Focused server and outpost regression tests
        run: node --test test/outpost-training.test.js test/severance-outpost.test.js
      - name: Install Chromium for real graphics and authenticated guest gameplay
        run: npx playwright install --with-deps chromium
      - name: Verify firing interactions and capture range/armory at desktop and TV sizes
        run: node test/e2e/outpost-training-visual.mjs
        env:
          ATTUNEMENT_CAPTURE_QUALITY: '2'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: outpost-firing-range-day-night-desktop-tv
          path: outpost-range-evidence/
          retention-days: 14
          if-no-files-found: ignore
