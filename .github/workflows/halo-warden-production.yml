name: One-off Halo Warden fitted armour production build
on:
  push:
    branches:
      - feat/halo-guard-fitted-lower-armor-20261122
    paths:
      - 'tools/asset-pipeline/asset_pipeline/humanoid_wardrobe.py'
      - 'tools/asset-pipeline/asset_pipeline/mech_humanoid.py'
      - 'tools/asset-pipeline/tests/test_warden_lower.py'
      - '.github/workflows/halo-warden-production.yml'

jobs:
  author:
    if: github.repository == 'ruishinor/game-dev'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - name: Install locked pipeline and project dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r tools/asset-pipeline/requirements.txt
          npm ci
      - name: Validate authored lower-body geometry before Blender work
        working-directory: tools/asset-pipeline
        run: python -m unittest discover -s tests -v
      - name: Rebuild complete accepted Halo production GLB
        working-directory: tools/asset-pipeline
        run: python -m asset_pipeline all --asset halo_construct
      - name: Update runtime asset manifest and verify exact output
        run: |
          node tools/assets/build.mjs halo_construct
          test -s client/assets/halo_construct.glb
          test "$(head -c4 client/assets/halo_construct.glb)" = glTF
          sha256sum client/assets/halo_construct.glb
      - name: Test reconstructed Warden in live browser
        run: |
          npx playwright install --with-deps chromium
          node test/e2e/halo-npcs.mjs
      - name: Stage only verified runtime files
        run: |
          mkdir -p output/runtime
          cp client/assets/halo_construct.glb output/runtime/halo_construct.glb
          cp client/assets/manifest.json output/runtime/manifest.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: halo-warden-validated-runtime
          path: output/
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: halo-warden-visual-evidence
          path: halo-evidence/
          if-no-files-found: ignore
          retention-days: 7

  publish:
    needs: author
    if: github.repository == 'ruishinor/game-dev' && github.ref == 'refs/heads/feat/halo-guard-fitted-lower-armor-20261122'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: halo-warden-validated-runtime
          path: candidate/
      - name: Publish only the validated GLB and manifest to this internal branch
        run: |
          test -s candidate/runtime/halo_construct.glb
          test "$(head -c4 candidate/runtime/halo_construct.glb)" = glTF
          cp candidate/runtime/halo_construct.glb client/assets/halo_construct.glb
          cp candidate/runtime/manifest.json client/assets/manifest.json
          git add -- client/assets/halo_construct.glb client/assets/manifest.json
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'build(halo): publish fitted Warden lower armour runtime GLB'
            git push origin HEAD:refs/heads/feat/halo-guard-fitted-lower-armor-20261122
          fi
