# Every PR must generate the repository-ruleset-required status check
# "Core Node and publication tests". Never filter it by changed paths.
# Post-merge main remains separately verified at its exact pushed SHA.
name: Main integration health

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Deliberately no workflow-level concurrency group: GitHub Actions can
# replace an older PENDING run sharing a group even if cancel-in-progress is
# false. Every merged main SHA must be independently validated.

jobs:
  core-node:
    name: Core Node and publication tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: node --test test/publication-preflight.test.js
      - name: Verify core entry-point syntax
        run: node --check server/index.js && node --check server/net.js && node --check client/src/main.js && node --check client/src/ui.js && node --check test/e2e/initiation.mjs
