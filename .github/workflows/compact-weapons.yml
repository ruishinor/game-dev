name: Compact weapon models browser integration
on:
  pull_request:
    paths:
      - 'client/weapon-assets/**'
      - 'client/src/weapon-visuals.js'
      - 'client/src/characters.js'
      - 'client/src/main.js'
      - 'shared/weapon-visual.js'
      - 'test/e2e/compact-weapons.mjs'
      - '.github/workflows/compact-weapons.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compact-weapons:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: node test/e2e/compact-weapons.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: compact-weapon-evidence
          path: compact-weapon-evidence/
          if-no-files-found: ignore
