name: Lumenfen GLB production-pipeline composition

on:
  pull_request:
    paths:
      - 'tools/assets/lumenfen-*'
      - 'assets/lumenfen-donors.json'
      - '.github/workflows/lumenfen-source-inventory.yml'
      - 'assets/source-archives/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Check Blender authoring script syntax before expensive mesh jobs
        run: python3 -m py_compile tools/assets/lumenfen-remesh.py tools/assets/lumenfen-remesh-evidence.py
      - name: Verify 138 production-pipeline donor GLBs and report geometry
        run: python3 tools/assets/lumenfen-source-inventory.py
      - name: Stage eight selected cross-genre donors in the pipeline workspace
        run: python3 tools/assets/lumenfen-stage-donors.py .asset-cache/pipeline/lumenfen/stage
      - name: Compose reusable GLB for pipeline development and validate eight nodes
        run: node tools/assets/lumenfen-compose-donors.mjs .asset-cache/pipeline/lumenfen/stage .asset-cache/pipeline/lumenfen/outputs
      - name: Verify exported GLB composite geometry, buffers and source lineage
        run: node tools/assets/lumenfen-verify-source-study.mjs .asset-cache/pipeline/lumenfen/outputs
      - name: Owner-authorized GLB pipeline composition artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lumenfen-production-pipeline-composite
          path: .asset-cache/pipeline/lumenfen/outputs/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  remodel:
    needs: inventory
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - run: npm ci
      - name: Install Blender Python mesh authoring runtime
        run: python -m pip install --disable-pip-version-check --no-cache-dir 'bpy==5.3.0'
      - name: Rebuild selected GLB source composite without altering source archive
        run: |
          python3 tools/assets/lumenfen-stage-donors.py .asset-cache/pipeline/lumenfen/stage
          node tools/assets/lumenfen-compose-donors.mjs .asset-cache/pipeline/lumenfen/stage .asset-cache/pipeline/lumenfen/outputs
          node tools/assets/lumenfen-verify-source-study.mjs .asset-cache/pipeline/lumenfen/outputs
      - name: Apply actual Blender remesh, worked-edge geometry and detail assemblies
        run: |
          python tools/assets/lumenfen-remesh.py \
            .asset-cache/pipeline/lumenfen/outputs/lumenfen-donor-composite.glb \
            .asset-cache/pipeline/lumenfen/remeshed
      - name: Render front and side evidence from exported GLBs (Cycles CPU)
        run: |
          python tools/assets/lumenfen-remesh-evidence.py .asset-cache/pipeline/lumenfen/remeshed
      - name: Validate GLB topology, geometry lineage and real rendered inspection views
        run: node tools/assets/lumenfen-remesh-verify.mjs .asset-cache/pipeline/lumenfen/remeshed
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: lumenfen-static-donor-remeshed-glbs
          path: .asset-cache/pipeline/lumenfen/remeshed/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
