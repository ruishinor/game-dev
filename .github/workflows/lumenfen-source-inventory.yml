name: Lumenfen GLB donor inspection

on:
  pull_request:
    paths:
      - 'tools/assets/lumenfen-*'
      - 'assets/lumenfen-donors.json'
      - '.github/workflows/lumenfen-source-inventory.yml'
      - 'assets/source-archives/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Verify 138 quarantined donor GLBs and report their geometry
        run: python3 tools/assets/lumenfen-source-inventory.py
      - name: Stage eight selected cross-genre donors outside browser tree
        run: python3 tools/assets/lumenfen-stage-donors.py .lumenfen-source-stage
      - name: Compose audit-only GLB studies; require eight actual node selections
        run: node tools/assets/lumenfen-compose-donors.mjs .lumenfen-source-stage .lumenfen-candidates
      - name: Inspectable source-only study bundle (NOT gameplay art)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lumenfen-raw-donor-studies-not-runtime
          path: .lumenfen-candidates/
          if-no-files-found: error
          retention-days: 7
