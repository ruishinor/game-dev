name: Ground companion browser integration
on:
  pull_request:
    paths:
      - 'server/net.js'
      - 'server/store.js'
      - 'server/sim/survey-strider.js'
      - 'server/sim/spindle.js'
      - 'server/sim/ground-navigation.js'
      - 'server/sim/companion.js'
      - 'server/sim/game.js'
      - 'client/src/assets.js'
      - 'client/src/characters.js'
      - 'client/src/spindle.js'
      - 'client/src/portraits.js'
      - 'client/assets/spindle.glb'
      - 'client/assets/manifest.json'
      - 'tools/assets/**'
      - 'test/spindle*.test.js'
      - 'client/src/main.js'
      - 'client/src/ui.js'
      - 'shared/spindle.js'
      - 'shared/content.js'
      - 'shared/gadgets.js'
      - 'shared/crafting.js'
      - 'test/e2e/ground-companion.mjs'
      - 'test/e2e/spindle.mjs'
      - '.github/workflows/ground-companion.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-pr-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
jobs:
  companion:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: node test/e2e/ground-companion.mjs
      - run: node test/e2e/spindle.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: strider-evidence
          path: strider-evidence/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: spindle-evidence
          path: docs/evidence/spindle/gameplay/
          if-no-files-found: ignore
