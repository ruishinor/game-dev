name: HUD accessibility browser integration
on:
  pull_request:
    paths:
      - 'client/src/hotkey-bindings.js'
      - 'client/src/ui.js'
      - 'client/src/main.js'
      - 'client/src/input.js'
      - 'client/src/portraits.js'
      - 'client/src/world-atlas.js'
      - 'client/style.css'
      - 'test/e2e/hud-accessibility.mjs'
      - '.github/workflows/hud-accessibility.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  hud:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: node test/e2e/hud-accessibility.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: hud-readability-evidence
          path: test/e2e/out/hud-*.png
          if-no-files-found: ignore
