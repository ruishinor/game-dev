name: Sanctum Warden rifle pipeline build and donor audit
on:
  pull_request:
    paths:
      - 'tools/assets/warden-archive-audit.py'
      - 'client/src/halo-construct.js'
      - 'tools/assets/warden-*'
      - '.github/workflows/warden-archive-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Identify exact rifle and clothing donor nodes
        run: python3 tools/assets/warden-archive-audit.py
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Build both donor-derived rifles into the production pipeline
        run: node tools/assets/warden-rifle-source.mjs
      - name: Retain owner-authorized Warden rifle GLB build artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v4.6.2
        with:
          name: warden-pipeline-rifles
          path: .asset-cache/pipeline/warden_rifles/*.glb
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
      - name: Store inventory report (JSON metadata only)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: warden-source-donor-metadata
          path: warden-archive-audit.json
          retention-days: 3
