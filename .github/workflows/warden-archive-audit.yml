name: Sanctum Warden archive donor audit
on:
  pull_request:
    paths:
      - 'tools/assets/warden-archive-audit.py'
      - 'client/src/halo-construct.js'
      - 'tools/assets/warden-*'
      - '.github/workflows/warden-archive-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Identify exact rifle and clothing donor nodes without publishing source GLBs
        run: python3 tools/assets/warden-archive-audit.py
      - name: Store inventory report (JSON metadata only)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: warden-source-donor-metadata
          path: warden-archive-audit.json
          retention-days: 3
