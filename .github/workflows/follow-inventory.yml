name: Follow and inventory browser regression
on:
  pull_request:
    paths:
      - 'client/src/main.js'
      - 'client/src/ui.js'
      - 'client/src/journal-ui.js'
      - 'client/src/inventory-view.js'
      - 'client/src/loot-ui.js'
      - 'client/src/interact-target.js'
      - 'server/sim/loot.js'
      - 'server/sim/game.js'
      - 'server/net.js'
      - 'test/e2e/play.mjs'
      - '.github/workflows/follow-inventory.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-pr-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e -- --follow-inventory
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: selective-loot-browser-evidence
          path: test/e2e/out/loot-*.png
          if-no-files-found: ignore
