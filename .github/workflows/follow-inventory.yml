name: Follow and inventory browser regression
on:
  pull_request:
    paths:
      - 'client/src/main.js'
      - 'client/src/ui.js'
      - 'client/src/journal-ui.js'
      - 'client/src/inventory-view.js'
      - 'client/src/loot-ui.js'
      - 'client/src/interact-target.js'
      - 'server/sim/loot.js'
      - 'server/sim/game.js'
      - 'server/net.js'
      - 'test/e2e/play.mjs'
      - '.github/workflows/follow-inventory.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e -- --follow-inventory
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: selective-loot-browser-evidence
          path: test/e2e/out/loot-01-selective.png
          if-no-files-found: ignore
