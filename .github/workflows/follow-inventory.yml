name: Follow and inventory browser regression
on:
  pull_request:
    paths:
      - 'client/src/**'
      - 'client/style.css'
      - 'server/**'
      - 'shared/**'
      - 'test/e2e/play.mjs'
      - '.github/workflows/follow-inventory.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e -- --follow-inventory
