# Conservatively batch routine dependency proposals. Security advisories may
# require faster targeted remediation; no automatic dependency merges are enabled.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
      time: "06:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 2
    groups:
      npm-minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
      time: "06:30"
      timezone: Etc/UTC
    open-pull-requests-limit: 1
