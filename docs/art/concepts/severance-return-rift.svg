<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="490" viewBox="0 0 1000 490" role="img" aria-labelledby="title desc"><title id="title">Paired return-rift concept</title><desc id="desc">Existing Reach Phase Scar is mirrored in the Expanse, stable and placed on a walkable foundation. The original gate remains unchanged.</desc><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="6.5" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#84b3b3"/></marker><linearGradient id="rift" x1="0" x2="1"><stop stop-color="#50566d"/><stop offset=".5" stop-color="#b5a7e5"/><stop offset="1" stop-color="#5a8c83"/></linearGradient></defs><rect width="1000" height="490" rx="16" fill="#152326"/><g font-family="system-ui, sans-serif" fill="#e4ece9"><text x="44" y="45" font-size="15" font-weight="700" fill="#83b4ad" text-anchor="start">ATTUNEMENT   /   WORLD CONCEPT  •  CLAUDE-RESERVED</text><text x="44" y="82" font-size="31" font-weight="700" fill="#e4ece9" text-anchor="start">A coherent return rift</text><rect x="44" y="110" width="432" height="286" rx="10" fill="#1e3033" stroke="#668786"/><rect x="524" y="110" width="432" height="286" rx="10" fill="#1e3033" stroke="#668786"/><text x="260" y="143" font-size="22" font-weight="650" fill="#e4ece9" text-anchor="middle">Verdigris Reach</text><text x="740" y="143" font-size="22" font-weight="650" fill="#e4ece9" text-anchor="middle">Severance Expanse</text><path d="M70 320H450M550 320H930" stroke="#77918a" stroke-width="3"/><ellipse cx="260" cy="320" rx="62" ry="13" fill="#405355" stroke="#78918b"/><path d="M220 317 Q219 236 245 201 M300 317 Q302 236 272 190" fill="none" stroke="#8c9993" stroke-width="10" stroke-linecap="round"/><path d="M256 204 Q219 232 239 272 Q251 303 260 308 Q296 275 279 242Z" fill="url(#rift)" stroke="#dfd3fe" stroke-width="2"/><path d="M258 210Q244 244 263 264T260 302" fill="none" stroke="#f1ecff" stroke-width="2"/><ellipse cx="740" cy="320" rx="62" ry="13" fill="#405355" stroke="#78918b"/><path d="M700 317 Q699 236 725 201 M780 317 Q782 236 752 190" fill="none" stroke="#8c9993" stroke-width="10" stroke-linecap="round"/><path d="M736 204 Q699 232 719 272 Q731 303 740 308 Q776 275 759 242Z" fill="url(#rift)" stroke="#dfd3fe" stroke-width="2"/><path d="M738 210Q724 244 743 264T740 302" fill="none" stroke="#f1ecff" stroke-width="2"/><text x="260" y="367" font-size="18" font-weight="600" fill="#e4ece9" text-anchor="middle">Existing Phase Scar</text><text x="740" y="367" font-size="18" font-weight="600" fill="#e4ece9" text-anchor="middle">Stable return variant</text><path d="M458 238H542" stroke="#84b3b3" stroke-width="2" marker-end="url(#arr)"/><path d="M542 265H458" stroke="#84b3b3" stroke-width="2" marker-end="url(#arr)"/><text x="500" y="427" font-size="17" font-weight="500" fill="#c4d9d4" text-anchor="middle">Same asset identity  •  level foundation  •  aligned approach and interaction</text><text x="500" y="458" font-size="14" font-weight="400" fill="#aabbba" text-anchor="middle">Schematic only; not final asset artwork or an implementation capture.</text></g></svg>