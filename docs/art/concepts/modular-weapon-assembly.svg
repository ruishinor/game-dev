<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="598" viewBox="0 0 1000 598" role="img" aria-labelledby="title desc"><title id="title">Modular weapon assembly</title><desc id="desc">Three acquisition sources converge into compatible weapon components, assembly, and functional equipment. Longpoint remains independent.</desc><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="6.5" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#84b3b3"/></marker><linearGradient id="rift" x1="0" x2="1"><stop stop-color="#50566d"/><stop offset=".5" stop-color="#b5a7e5"/><stop offset="1" stop-color="#5a8c83"/></linearGradient></defs><rect width="1000" height="598" rx="16" fill="#152326"/><g font-family="system-ui, sans-serif" fill="#e4ece9"><text x="44" y="46" font-size="15" font-weight="700" fill="#83b4ad" text-anchor="start">ATTUNEMENT   /   SYSTEM CONCEPT  •  REC-01</text><text x="44" y="83" font-size="31" font-weight="700" fill="#e4ece9" text-anchor="start">Modular weapon assembly</text><rect x="44" y="113" width="288" height="77" rx="9" fill="#23383b" stroke="#668786"/><text x="188" y="143" font-size="20" font-weight="650" fill="#e4ece9" text-anchor="middle">Special enemy loot</text><text x="188" y="167" font-size="14" font-weight="400" fill="#b3c7c4" text-anchor="middle">Selected parts and rare discoveries</text><rect x="356" y="113" width="288" height="77" rx="9" fill="#23383b" stroke="#668786"/><text x="500" y="143" font-size="20" font-weight="650" fill="#e4ece9" text-anchor="middle">Specialist vendors</text><text x="500" y="167" font-size="14" font-weight="400" fill="#b3c7c4" text-anchor="middle">Selected compatible components</text><rect x="668" y="113" width="288" height="77" rx="9" fill="#23383b" stroke="#668786"/><text x="812" y="143" font-size="20" font-weight="650" fill="#e4ece9" text-anchor="middle">Fabrication</text><text x="812" y="167" font-size="14" font-weight="400" fill="#b3c7c4" text-anchor="middle">Intermediate crafted parts</text><path d="M188 191L405 236" fill="none" stroke="#84b3b3" stroke-width="2" marker-end="url(#arr)"/><path d="M500 191L500 236" fill="none" stroke="#84b3b3" stroke-width="2" marker-end="url(#arr)"/><path d="M812 191L595 236" fill="none" stroke="#84b3b3" stroke-width="2" marker-end="url(#arr)"/><rect x="255" y="239" width="490" height="75" rx="9" fill="#23383b" stroke="#668786"/><text x="500" y="269" font-size="20" font-weight="650" fill="#e4ece9" text-anchor="middle">Compatible components</text><text x="500" y="293" font-size="14" font-weight="400" fill="#b3c7c4" text-anchor="middle">Housings • lenses • cells • frames • modules</text><path d="M500 315L500 349" fill="none" stroke="#84b3b3" stroke-width="2" marker-end="url(#arr)"/><rect x="255" y="352" width="490" height="75" rx="9" fill="#23383b" stroke="#668786"/><text x="500" y="382" font-size="20" font-weight="650" fill="#e4ece9" text-anchor="middle">Weapon assembly</text><text x="500" y="406" font-size="14" font-weight="400" fill="#b3c7c4" text-anchor="middle">Learned blueprint • skill • station • ownership</text><path d="M500 428L500 463" fill="none" stroke="#84b3b3" stroke-width="2" marker-end="url(#arr)"/><rect x="255" y="466" width="490" height="75" rx="9" fill="#23383b" stroke="#668786"/><text x="500" y="496" font-size="20" font-weight="650" fill="#e4ece9" text-anchor="middle">Functional weapon</text><text x="500" y="520" font-size="14" font-weight="400" fill="#b3c7c4" text-anchor="middle">Authoritative output • equip • distinct presentation</text><text x="500" y="574" font-size="16" font-weight="500" fill="#c8b992" text-anchor="middle">Longpoint stays on its established independent acquisition path.</text></g></svg>